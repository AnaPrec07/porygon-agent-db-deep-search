command:
- uv
- run
- start-server
env:
- name: MLFLOW_TRACKING_URI
  value: http://127.0.0.1:51099
- name: MLFLOW_EXPERIMENT_NAME
  value: agent-langgraph
- name: DATABRICKS_AGENTBRICKS_RUNTIME_STORE_LOCAL
  value: 'true'
# Local development: records go to ./.deep_search_data, retrieval is off, and no model is set (stub nodes run).
- name: DEEP_SEARCH_OBJECT_STORE
  value: local:.deep_search_data
- name: DEEP_SEARCH_TENANT_ID
  value: dev-local
- name: DEEP_SEARCH_MEMORY_ENABLED
  value: 'false'
